# Which action each entity type gets at each level. Owner: P3.
# Actions: keep, mask, generalize, fake
# An entity type not listed for a level is kept.
# Rule: a higher level must act on everything a lower level acts on (tests/test_policy.py checks this).
levels:
  1:
    PERSON: mask
    EMAIL: mask
    PHONE: mask
    ID_NUMBER: mask
  2:
    PERSON: mask
    EMAIL: mask
    PHONE: mask
    ID_NUMBER: mask
    DATE: generalize
    LOCATION: generalize
    ORG: mask
  3:
    PERSON: fake
    EMAIL: fake
    PHONE: fake
    ID_NUMBER: fake
    DATE: generalize
    LOCATION: generalize
    ORG: fake
